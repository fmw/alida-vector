apiVersion: batch/v1
kind: CronJob
metadata:
  name: alida-vector
  namespace: alida-vector
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Retry one complete crawl only when Alida reports EX_TEMPFAIL (75).
      backoffLimit: 1
      podFailurePolicy:
        rules:
          # Replace Pods lost to node drains or other disruptions without
          # consuming the application retry budget.
          - action: Ignore
            onPodConditions:
              - type: DisruptionTarget
          - action: FailJob
            onExitCodes:
              containerName: alida-vector
              operator: NotIn
              values: [75]
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: alida-vector
              image: ghcr.io/fmw/alida-vector@sha256:REPLACE_WITH_IMAGE_DIGEST
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
              args:
                - crawl
                - --config
                - /config/alida.yml
              env:
                - name: JAVA_TOOL_OPTIONS
                  value: "-XX:MaxRAMPercentage=75.0"
                - name: XDG_CACHE_HOME
                  value: /var/cache/alida-vector
                - name: ALIDA_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: alida-vector
                      key: database-url
                - name: ALIDA_DATABASE_USER
                  valueFrom:
                    secretKeyRef:
                      name: alida-vector
                      key: database-user
                - name: ALIDA_DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: alida-vector
                      key: database-password
                - name: OPENAI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: alida-vector
                      key: openai-api-key
                - name: ALIDA_SLACK_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: alida-vector
                      key: slack-webhook-url
                      optional: true
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: cache
                  mountPath: /var/cache/alida-vector
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: config
              configMap:
                name: alida-vector-config
            - name: cache
              emptyDir:
                sizeLimit: 512Mi
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
