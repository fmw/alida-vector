<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">An Alida Vector candidate report being rejected</title>
  <desc id="desc">Illustrative terminal output showing a candidate index with unexpectedly removed documents receiving a fail verdict and being rejected.</desc>

  <rect width="1400" height="820" fill="#f4f1ea"/>
  <text x="110" y="92" fill="#152b26" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Inspect changes before they reach the live index</text>
  <text x="110" y="135" fill="#59706a" font-family="Arial, Helvetica, sans-serif" font-size="23">A candidate with an unexpected content loss is held for review.</text>

  <rect x="110" y="182" width="1180" height="548" rx="22" fill="#17211f"/>
  <path d="M110 246h1180" stroke="#35413e" stroke-width="2"/>
  <circle cx="151" cy="214" r="9" fill="#e76f51"/>
  <circle cx="181" cy="214" r="9" fill="#e9c46a"/>
  <circle cx="211" cy="214" r="9" fill="#2a9d75"/>
  <text x="700" y="222" text-anchor="middle" fill="#93a29e" font-family="Arial, Helvetica, sans-serif" font-size="17">alida-vector — candidate report</text>

  <g fill="#e8eee9" font-family="DejaVu Sans Mono, monospace" font-size="20">
    <text x="155" y="289"><tspan fill="#54c7a1">$</tspan> alida-vector report 018c9099-041d-7f5b-9b65-5b8f08f8e61d</text>
    <text x="155" y="329">Run: 018c9099-041d-7f5b-9b65-5b8f08f8e61d</text>
    <text x="155" y="361">Index: product-docs</text>
    <text x="155" y="393">Status: complete</text>
    <text x="155" y="425">Verdict: <tspan fill="#ff8b73" font-weight="700">fail</tspan></text>
    <text x="155" y="473" fill="#aab7b3">Deterministic Gate</text>
    <text x="155" y="505">verdict: caution</text>
    <text x="155" y="537" fill="#e9c46a">- max_removed_percentage caution: exceeded deterministic threshold</text>
    <text x="155" y="585" fill="#aab7b3">Diff</text>
    <text x="155" y="617">added: <tspan fill="#54c7a1">3</tspan>    removed: <tspan fill="#ff8b73">127</tspan>    changed: <tspan fill="#e9c46a">8</tspan>    moved: 0</text>
    <text x="155" y="665"><tspan fill="#54c7a1">$</tspan> alida-vector reject 018c9099-041d-7f5b-9b65-5b8f08f8e61d</text>
    <text x="155" y="697" fill="#ffb3a4">Rejected run 018c9099-041d-7f5b-9b65-5b8f08f8e61d.</text>
  </g>

  <rect x="1040" y="85" width="250" height="48" rx="24" fill="#fff" stroke="#d5ddd9" stroke-width="2"/>
  <circle cx="1070" cy="109" r="8" fill="#e76f51"/>
  <text x="1090" y="117" fill="#4d625d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">LIVE INDEX UNCHANGED</text>
  <text x="110" y="779" fill="#59706a" font-family="Arial, Helvetica, sans-serif" font-size="18">Illustrative output using Alida Vector's current CLI report format.</text>
</svg>
