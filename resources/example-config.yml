storage:
  metadata:
    type: postgres
    jdbc_url: ${ALIDA_DATABASE_URL}
    user: ${ALIDA_DATABASE_USER}
    password: ${ALIDA_DATABASE_PASSWORD}
  vectors:
    type: pgvector

verification:
  # Defaults to true. Set enabled: false for local crawl/extraction tuning
  # when you want to avoid LLM API calls. Production refreshes should keep it enabled.
  enabled: true
  provider: openai
  model: gpt-4.1-mini
  api_key: ${OPENAI_API_KEY}
  prompt_policy_version: "2026-06-08"
  deterministic_gate_version: "2026-06-08"
  deterministic_thresholds:
    max_removed_absolute: 25
    max_removed_percentage: 0.2
    max_changed_percentage: 0.5
    max_item_failure_percentage: 0.05
    max_empty_or_short_document_percentage: 0.05

notifications:
  slack_webhook_url: ${ALIDA_SLACK_WEBHOOK_URL}

indexes:
  - name: support-knowledge-base
    auto_activate: true
    languages:
      allowed: [en, de, nl, fr]
      fallback: en
    embedding:
      provider: openai
      model: text-embedding-3-small
      embedding_dimensions: 1536
      api_key: ${OPENAI_API_KEY}
      inter_batch_delay_ms: 250
      retry_jitter_ms: 100
      # For local crawl/extraction tuning only, use provider: noop with the same
      # embedding_dimensions. It stores placeholder vectors and cannot be activated.
    chunking:
      max_input_tokens: 8192
      max_tokens: 6550
      safety_multiplier: 1.2
    sources:
      - id: blog
        type: website
        sitemap_url: https://example.test/sitemap.xml
        max_sitemap_depth: 10
        inter_request_delay_ms: 100
        denied_urls:
          - https://example.test/not-for-indexing/
        language:
          mode: auto
          html_selectors:
            - html[lang]
            - meta[property=og:locale]
      - id: support
        type: jira-service-management
        url: https://example.atlassian.net/servicedesk/customer/portal/1
        language:
          mode: detect
