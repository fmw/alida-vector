storage:
  metadata:
    type: postgres
    jdbc_url: ${ALIDA_DATABASE_URL}
    user: ${ALIDA_DATABASE_USER}
    password: ${ALIDA_DATABASE_PASSWORD}
  vectors:
    type: pgvector

verification:
  # Defaults to true. Set enabled: false for local crawl/extraction tuning
  # when you want to avoid LLM API calls. Production refreshes should keep it enabled.
  enabled: true
  provider: openai
  # Balanced intelligence and cost in the current GPT-5.6 family.
  model: gpt-5.6-terra
  api_key: ${OPENAI_API_KEY}
  # OpenAI and Azure OpenAI use temperature 0 when no generation controls are
  # configured. Set a number, or null to use the model's default.
  # temperature: 1
  # Alternative sampling control; do not configure together with temperature.
  # top_p: 0.9
  # max_completion_tokens: 2048
  reasoning_effort: low
  # verbosity: low
  prompt_policy_version: "2026-06-08"
  deterministic_gate_version: "2026-06-08"
  # Verification results are cached by an exact hash of the provider-facing
  # prompts and semantic verifier settings. Give each environment a stable
  # attestor name. A later environment can optionally trust attestations from
  # an earlier environment's migrated Alida metadata database.
  attestations:
    attestor: pre-production
    # trusted_sources:
    #   - name: pre-production
    #     type: postgres
    #     jdbc_url: ${ALIDA_TRUSTED_DATABASE_URL}
    #     user: ${ALIDA_TRUSTED_DATABASE_USER}
    #     password: ${ALIDA_TRUSTED_DATABASE_PASSWORD}
    #     attestors: [pre-production]
  deterministic_thresholds:
    max_removed_absolute: 25
    max_removed_percentage: 0.2
    max_changed_percentage: 0.5
    max_item_failure_percentage: 0.05
    max_empty_or_short_document_percentage: 0.05

notifications:
  slack_webhook_url: ${ALIDA_SLACK_WEBHOOK_URL}

# Optional. When omitted, Alida keeps crawl history until it is pruned manually.
# After every fully successful crawl, remove eligible non-live runs for the
# selected indexes when they are older than this many days.
# retention:
#   max_age_days: 30

indexes:
  - name: support-knowledge-base
    auto_activate: true
    languages:
      allowed: [en, de, nl, fr]
      fallback: en
    embedding:
      provider: openai
      model: text-embedding-3-small
      embedding_dimensions: 1536
      api_key: ${OPENAI_API_KEY}
      inter_batch_delay_ms: 250
      retry_jitter_ms: 100
      # For local crawl/extraction tuning only, use provider: noop with the same
      # embedding_dimensions. It stores placeholder vectors and cannot be activated.
    chunking:
      max_input_tokens: 8192
      max_tokens: 6550
      safety_multiplier: 1.2
    sources:
      - id: blog
        type: website
        sitemap_url: https://example.test/sitemap.xml
        allowed_url_prefixes:
          - https://example.test/
        max_sitemap_depth: 10
        inter_request_delay_ms: 100
        denied_urls:
          - https://example.test/not-for-indexing/
        language:
          mode: auto
          html_selectors:
            - html[lang]
            - meta[property=og:locale]
      - id: object-docs
        type: s3
        bucket: alida-vector-fixtures
        region: us-east-1
        prefix: alida-vector-fixtures/docs/
        include_globs:
          - alida-vector-fixtures/docs/**/*.html
          - alida-vector-fixtures/docs/**/*.md
          - alida-vector-fixtures/docs/**/*.txt
          - alida-vector-fixtures/docs/**/*.json
        exclude_globs:
          - alida-vector-fixtures/docs/private/**
      - id: cloud-object-docs
        type: gcs
        bucket: alida-gcs-fixtures
        project_id: alida-dev
        # Optional outside Google Cloud. When omitted, GCS uses Application
        # Default Credentials from the runtime environment.
        # credentials_path: ${ALIDA_GCS_CREDENTIALS_PATH}
        prefix: fixtures/docs/
        include_globs:
          - fixtures/docs/**/*.html
          - fixtures/docs/**/*.md
          - fixtures/docs/**/*.txt
          - fixtures/docs/**/*.json
        exclude_globs:
          - fixtures/docs/private/**
      - id: support
        type: jira-service-management
        crawl_method: api
        url: https://example.atlassian.net/servicedesk/customer/portal/1
        allowed_url_prefixes:
          - https://example.atlassian.net/servicedesk/customer/portal/1/topic/
          - https://example.atlassian.net/servicedesk/customer/portal/1/article/
          - https://example.atlassian.net/plugins/servlet/servicedesk/customer/confluence/shim/
        denied_urls: []
        denied_url_prefixes: []
        max_pages: 1000
        # api crawl: per-source request parallelism
        api_max_concurrency: 20
        api_category_page_limit: 100
        # webdriver/auto crawl: number of parallel headless browsers
        # (defaults to 5 when omitted)
        max_concurrency: 5
        browser_restart_after_pages: 50
        browser_restart_after_failures: 2
        # how many times a failed render is re-enqueued before giving up
        render_failure_retries: 2
        progress_log_every_pages: 25
        dedupe_content: true
        dedupe_prefer_url_substrings:
          - /topic/
        inter_request_delay_ms: 100
        content_wait_selectors:
          - a[href*="/article/"]
          - a[href*="/topic/"]
          - main article
          - article
        remove_selectors:
          - footer
          - nav
          - "[role=dialog]"
          - "[data-testid=outer-BannerContainer]"
        strip_text:
          - "Did this article help? Yes No Need to raise a request? Contact us."
          - "Did this article help? Yes No"
          - "Need to raise a request? Contact us."
        language:
          mode: detect
